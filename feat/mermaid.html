<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.5/dist/driver.css">
    <script>
        // 初回描画前にテーマを適用（ちらつき防止）
        try {
            var t = localStorage.getItem('webtools:theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { }
    </script>

    <title>Mermaid Editor</title>
    <style>
        [hidden] {
            display: none !important;
        }

        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --bg: #f5f6f8;
            --panel: #ffffff;
            --subtle: #f6f8fa;
            --hover: #eef0f3;
            --border: #dfe3e8;
            --text: #1f2328;
            --muted: #656d76;
            --accent: #2563eb;
            --accent-weak: #e8f0fe;
            --code-bg: #f3f4f6;
            --danger: #d1242f;
            --checker1: #ffffff;
            --checker2: #e3e6ea;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #0d1117;
                --panel: #161b22;
                --subtle: #1c2330;
                --hover: #222b38;
                --border: #30363d;
                --text: #e6edf3;
                --muted: #8b949e;
                --accent: #6ea8fe;
                --accent-weak: #1b2a45;
                --code-bg: #212a36;
                --danger: #ff7b72;
                --checker1: #2a313c;
                --checker2: #222833;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0d1117;
            --panel: #161b22;
            --subtle: #1c2330;
            --hover: #222b38;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #6ea8fe;
            --accent-weak: #1b2a45;
            --code-bg: #212a36;
            --danger: #ff7b72;
            --checker1: #2a313c;
            --checker2: #222833;
        }

        html {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .app-header h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 700;
        }

        .spacer {
            flex: 1;
        }

        button,
        .btn {
            font: inherit;
            font-size: 13px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            line-height: 1.3;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover,
        .btn:hover {
            background: var(--hover);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        button.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        button.primary:hover {
            background: #1d4ed8;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        main.layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            display: grid;
            grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }

        @media (max-width: 860px) {
            main.layout {
                grid-template-columns: 1fr;
            }
        }

        .col {
            min-width: 0;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }

        .card+.card {
            margin-top: 16px;
        }

        .card h2 {
            font-size: 13px;
            margin: 0 0 10px;
            color: var(--muted);
            letter-spacing: .04em;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .card-head h2 {
            margin: 0;
            flex: 1;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field>label,
        .label {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .row>.grow {
            flex: 1;
            min-width: 0;
        }

        input[type=text],
        input[type=number],
        input[type=url],
        input[type=password],
        textarea,
        select {
            font: inherit;
            font-size: 14px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            width: 100%;
        }

        textarea {
            resize: vertical;
        }

        input[type=color] {
            width: 44px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel);
            cursor: pointer;
            flex: none;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
        }

        .val {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            font-size: 12px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
        }

        .error {
            color: var(--danger);
            font-size: 12px;
            white-space: pre-wrap;
        }

        pre.code {
            margin: 0;
            padding: 10px 12px;
            background: var(--code-bg);
            border-radius: 8px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
        }

        .checker {
            background-color: var(--checker1);
            background-image:
                linear-gradient(45deg, var(--checker2) 25%, transparent 25%, transparent 75%, var(--checker2) 75%),
                linear-gradient(45deg, var(--checker2) 25%, transparent 25%, transparent 75%, var(--checker2) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            color: var(--muted);
            cursor: pointer;
            transition: .15s;
        }

        .dropzone:hover,
        .dropzone.drag {
            border-color: var(--accent);
            background: var(--accent-weak);
            color: var(--text);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(20px);
            background: #24292f;
            color: #fff;
            border: 1px solid #444c56;
            padding: 8px 14px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: .2s;
            z-index: 1000;
            font-size: 13px;
            max-width: 90vw;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* driver.js をテーマに合わせる */
        .driver-popover {
            font-family: inherit;
            background: var(--panel);
            color: var(--text);
        }

        .driver-popover-title {
            color: var(--text);
        }

        .driver-popover-description,
        .driver-popover-progress-text {
            color: var(--muted);
        }

        .driver-popover-footer button {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            text-shadow: none;
        }

        .driver-popover-footer button:hover {
            background: var(--hover);
        }

        .driver-popover-close-btn {
            color: var(--muted);
        }

        .driver-popover-arrow-side-left.driver-popover-arrow {
            border-left-color: var(--panel);
        }

        .driver-popover-arrow-side-right.driver-popover-arrow {
            border-right-color: var(--panel);
        }

        .driver-popover-arrow-side-top.driver-popover-arrow {
            border-top-color: var(--panel);
        }

        .driver-popover-arrow-side-bottom.driver-popover-arrow {
            border-bottom-color: var(--panel);
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            padding: 8px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .toolbar .group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar select {
            width: auto;
        }

        .toolbar .lbl {
            font-size: 12px;
            color: var(--muted);
        }

        .mm-main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(280px, 40%) minmax(0, 1fr);
        }

        .pane {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--panel);
        }

        .pane+.pane {
            border-left: 1px solid var(--border);
        }

        .pane-title {
            font-size: 11px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 6px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--subtle);
        }

        #editor {
            flex: 1;
            width: 100%;
            resize: none;
            border: 0;
            outline: 0;
            padding: 14px 16px;
            border-radius: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
            font-size: 14px;
            line-height: 1.65;
            tab-size: 2;
            background: transparent;
        }

        #errBox {
            padding: 8px 14px;
            border-top: 1px solid var(--border);
            background: var(--subtle);
            max-height: 30%;
            overflow: auto;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        #stage {
            flex: 1;
            overflow: auto;
            padding: 16px;
            display: flex;
        }

        #out {
            margin: auto;
            max-width: none;
        }

        #out svg {
            display: block;
        }

        @media (max-width: 860px) {
            body {
                height: auto;
                overflow: auto;
            }

            .mm-main {
                grid-template-columns: 1fr;
                grid-template-rows: 280px 70vh;
            }

            .pane+.pane {
                border-left: 0;
                border-top: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <h1>🧜 Mermaid Editor</h1>
        <div class="spacer"></div>
        <button id="btnTheme" type="button" title="テーマ切替（自動 / ライト / ダーク）">🌓 自動</button>
        <button id="btnHelp" type="button" title="使い方ツアー">？</button>
    </header>

    <div class="toolbar">
        <div class="group">
            <select id="sampleSel" aria-label="テンプレート">
                <option value="">テンプレートを挿入（上書き）…</option>
                <option value="flowchart">フローチャート</option>
                <option value="sequence">シーケンス図</option>
                <option value="class">クラス図</option>
                <option value="state">状態遷移図</option>
                <option value="er">ER図</option>
                <option value="gantt">ガントチャート</option>
                <option value="pie">円グラフ</option>
                <option value="mindmap">マインドマップ</option>
            </select>
        </div>
        <div class="group">
            <span class="lbl">図のテーマ</span>
            <select id="mmTheme" aria-label="Mermaidテーマ">
                <option value="auto">自動（アプリに追従）</option>
                <option value="default">default</option>
                <option value="neutral">neutral</option>
                <option value="dark">dark</option>
                <option value="forest">forest</option>
                <option value="base">base</option>
            </select>
        </div>
        <div class="group" id="zoomGroup">
            <button type="button" id="zoomOut" title="縮小">−</button>
            <span class="lbl" id="zoomLabel" style="min-width:4.5em;text-align:center">フィット</span>
            <button type="button" id="zoomIn" title="拡大">＋</button>
            <button type="button" id="zoom100">100%</button>
            <button type="button" id="zoomFit">フィット</button>
        </div>
        <div class="spacer"></div>
        <div class="group" id="exportGroup">
            <span class="lbl">背景</span>
            <select id="exBg" aria-label="書き出し背景">
                <option value="auto">自動</option>
                <option value="transparent">透明</option>
                <option value="white">白</option>
                <option value="dark">ダーク</option>
            </select>
            <span class="lbl">PNG倍率</span>
            <select id="exScale" aria-label="PNG倍率">
                <option value="1">1x</option>
                <option value="2" selected>2x</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
            </select>
            <button type="button" id="btnSvg">SVG保存</button>
            <button type="button" id="btnPng" class="primary">PNG保存</button>
            <button type="button" id="btnCopyCode">コードをコピー</button>
        </div>
    </div>

    <main class="mm-main">
        <section class="pane" id="editorPane">
            <div class="pane-title">Mermaid</div>
            <textarea id="editor" spellcheck="false" aria-label="Mermaidコード"
                placeholder="ここにMermaidのコードを入力…"></textarea>
            <div id="errBox" class="error" hidden></div>
        </section>
        <section class="pane" id="stagePane">
            <div class="pane-title">Preview</div>
            <div id="stage">
                <div id="out"></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>
        /* ===================== common utilities ===================== */
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
        const debounce = (fn, ms = 150) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmtBytes = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';

        /* ---------- theme (auto / light / dark) ---------- */
        const THEME_KEY = 'webtools:theme';
        const THEMES = ['auto', 'light', 'dark'];
        const THEME_LABEL = { auto: '🌓 自動', light: '☀️ ライト', dark: '🌙 ダーク' };
        let theme = lsGet(THEME_KEY, 'auto');
        if (!THEMES.includes(theme)) theme = 'auto';
        const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
        const isDark = () => theme === 'dark' || (theme === 'auto' && darkMQ.matches);
        function applyTheme(t) {
            theme = t;
            if (t === 'auto') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', t);
            const b = $('#btnTheme');
            if (b) b.textContent = THEME_LABEL[t];
            lsSet(THEME_KEY, t);
            document.dispatchEvent(new Event('themechange'));
        }
        if (darkMQ.addEventListener) darkMQ.addEventListener('change', () => document.dispatchEvent(new Event('themechange')));

        /* ---------- toast / download / clipboard ---------- */
        let toastTimer;
        function toast(msg) {
            let el = $('#toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status');
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }
        function downloadBlob(blob, name) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        }
        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); } catch (e2) { }
                ta.remove();
            }
            toast('コピーしました');
        }
        async function copyImageFromCanvas(canvas) {
            try {
                const blob = await canvasToBlob(canvas, 'image/png');
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                toast('画像をコピーしました');
            } catch (e) {
                toast('この環境では画像のコピーができません。保存を使ってください');
            }
        }

        /* ---------- image / canvas helpers ---------- */
        const canvasToBlob = (canvas, type = 'image/png', q) => new Promise(r => canvas.toBlob(r, type, q));
        function loadImage(url) {
            return new Promise((res, rej) => {
                const i = new Image();
                i.onload = () => res(i);
                i.onerror = () => rej(new Error('image load failed'));
                i.src = url;
            });
        }
        function roundRectPath(ctx, x, y, w, h, r) {
            r = Math.max(0, Math.min(r, w / 2, h / 2));
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }
        /* 大きく縮小するときは段階的に半分にして画質を保つ */
        function resample(src, sw, sh, dw, dh) {
            let cur = src, cw = sw, ch = sh;
            while (cw / 2 >= dw && ch / 2 >= dh) {
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(cw / 2));
                c.height = Math.max(1, Math.round(ch / 2));
                const x = c.getContext('2d');
                x.imageSmoothingQuality = 'high';
                x.drawImage(cur, 0, 0, c.width, c.height);
                cur = c; cw = c.width; ch = c.height;
            }
            const out = document.createElement('canvas');
            out.width = Math.max(1, Math.round(dw));
            out.height = Math.max(1, Math.round(dh));
            const o = out.getContext('2d');
            o.imageSmoothingQuality = 'high';
            o.drawImage(cur, 0, 0, out.width, out.height);
            return out;
        }

        /* ---------- file drop ---------- */
        function setupDrop(zone, input, cb) {
            zone.addEventListener('click', () => input.click());
            zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
            ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag'); }));
            ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag'); }));
            zone.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) cb(f); });
            input.addEventListener('change', () => { const f = input.files[0]; if (f) cb(f); input.value = ''; });
        }
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        /* ---------- lazy script loader ---------- */
        const _scripts = {};
        function loadScript(src) {
            if (!_scripts[src]) {
                _scripts[src] = new Promise((res, rej) => {
                    const s = document.createElement('script');
                    s.src = src;
                    s.onload = res;
                    s.onerror = () => { delete _scripts[src]; rej(new Error('読み込みに失敗しました: ' + src)); };
                    document.head.appendChild(s);
                });
            }
            return _scripts[src];
        }

        /* ---------- init: theme button + driver.js onboarding ---------- */
        const DRIVER_JS = 'https://cdn.jsdelivr.net/npm/driver.js@1.3.5/dist/driver.js.iife.js';
        function initCommon({ steps, beforeTour } = {}) {
            applyTheme(theme);
            const bt = $('#btnTheme');
            if (bt) bt.addEventListener('click', () => applyTheme(THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]));

            const runTour = async () => {
                try { await loadScript(DRIVER_JS); } catch (e) { toast('ツアーの読み込みに失敗しました'); return; }
                if (beforeTour) await beforeTour();
                const { driver } = window.driver.js;
                driver({
                    showProgress: true, allowClose: true,
                    nextBtnText: '次へ', prevBtnText: '戻る', doneBtnText: '完了',
                    progressText: '{{current}} / {{total}}',
                    steps: steps ? steps() : []
                }).drive();
            };
            const bh = $('#btnHelp');
            if (bh) bh.addEventListener('click', runTour);

            const params = new URLSearchParams(location.search);
            if (params.get('onBoarding') === '1') {
                params.delete('onBoarding');
                const qs = params.toString();
                try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash); } catch (e) { }
                if (document.readyState === 'complete') runTour();
                else window.addEventListener('load', runTour);
            }
        }


        /* ===================== Mermaid editor ===================== */
        const LS_CODE = 'webtools:mermaid:code';
        const SAMPLES = {
            flowchart: `flowchart TD
  A[開始] --> B{条件分岐}
  B -->|はい| C[処理 A]
  B -->|いいえ| D[処理 B]
  C --> E[終了]
  D --> E`,
            sequence: `sequenceDiagram
  participant U as ユーザー
  participant W as Webサーバー
  participant D as DB
  U->>W: リクエスト
  W->>D: クエリ
  D-->>W: 結果
  W-->>U: レスポンス`,
            class: `classDiagram
  class Animal {
    +String name
    +eat()
  }
  class Dog {
    +bark()
  }
  class Cat {
    +meow()
  }
  Animal <|-- Dog
  Animal <|-- Cat`,
            state: `stateDiagram-v2
  [*] --> 待機
  待機 --> 実行中: 開始
  実行中 --> 完了: 成功
  実行中 --> 失敗: エラー
  完了 --> [*]
  失敗 --> 待機: リトライ`,
            er: `erDiagram
  USER ||--o{ ORDER : places
  ORDER ||--|{ ITEM : contains
  USER {
    int id PK
    string name
  }
  ORDER {
    int id PK
    date ordered_at
  }`,
            gantt: `gantt
  title プロジェクト計画
  dateFormat YYYY-MM-DD
  section 設計
  要件定義 :done, a1, 2026-10-01, 7d
  基本設計 :active, a2, after a1, 10d
  section 開発
  実装 :a3, after a2, 14d
  テスト :a4, after a3, 7d`,
            pie: `pie title 使用言語
  "JavaScript" : 45
  "TypeScript" : 35
  "Python" : 20`,
            mindmap: `mindmap
  root((Webツール))
    画像
      圧縮
      切り抜き
    開発
      wrangler
      Markdown
    その他
      QRコード`
        };

        const editor = $('#editor'), out = $('#out'), stage = $('#stage'), errBox = $('#errBox');
        const mmReady = typeof mermaid !== 'undefined';
        let lastSvg = '';
        let baseW = 0;
        let zoom = 'fit';

        const effTheme = () => { const v = $('#mmTheme').value; return v === 'auto' ? (isDark() ? 'dark' : 'default') : v; };
        function configure() {
            mermaid.initialize({
                startOnLoad: false, securityLevel: 'strict', theme: effTheme(),
                htmlLabels: false, flowchart: { htmlLabels: false },
                fontFamily: '"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif'
            });
        }

        /* ---------- zoom ---------- */
        function applyZoom() {
            const svg = out.querySelector('svg');
            if (!svg) return;
            const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
            baseW = vb.length === 4 && isFinite(vb[2]) ? vb[2] : svg.getBoundingClientRect().width;
            svg.removeAttribute('height');
            if (zoom === 'fit') {
                svg.style.width = '100%';
                svg.style.maxWidth = baseW + 'px';
                svg.style.height = 'auto';
                $('#zoomLabel').textContent = 'フィット';
            } else {
                svg.style.width = baseW * zoom + 'px';
                svg.style.maxWidth = 'none';
                svg.style.height = 'auto';
                $('#zoomLabel').textContent = Math.round(zoom * 100) + '%';
            }
            out.style.width = zoom === 'fit' ? '100%' : '';
        }
        function curScale() {
            const svg = out.querySelector('svg');
            return svg && baseW ? svg.getBoundingClientRect().width / baseW : 1;
        }
        function stepZoom(f) {
            const base = zoom === 'fit' ? curScale() : zoom;
            zoom = Math.min(8, Math.max(0.1, base * f));
            applyZoom();
        }
        $('#zoomIn').addEventListener('click', () => stepZoom(1.25));
        $('#zoomOut').addEventListener('click', () => stepZoom(0.8));
        $('#zoom100').addEventListener('click', () => { zoom = 1; applyZoom(); });
        $('#zoomFit').addEventListener('click', () => { zoom = 'fit'; applyZoom(); });
        stage.addEventListener('wheel', e => {
            if (!(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();
            stepZoom(e.deltaY < 0 ? 1.1 : 0.9);
        }, { passive: false });

        /* ---------- render ---------- */
        let rendering = false, dirty = false, rid = 0;
        async function render() {
            if (!mmReady) return;
            if (rendering) { dirty = true; return; }
            rendering = true;
            try { do { dirty = false; await renderOnce(); } while (dirty); }
            finally { rendering = false; }
        }
        async function renderOnce() {
            const code = editor.value;
            stage.style.background = effTheme() === 'dark' ? '#0d1117' : '#ffffff';
            if (!code.trim()) { out.innerHTML = ''; lastSvg = ''; errBox.hidden = true; return; }
            configure();
            const id = 'mmd-' + (++rid);
            try {
                await mermaid.parse(code);
                const { svg } = await mermaid.render(id, code);
                out.innerHTML = svg;
                lastSvg = svg;
                errBox.hidden = true;
                applyZoom();
            } catch (e) {
                errBox.textContent = (e && e.message) ? e.message : String(e);
                errBox.hidden = false;
                const stray = document.getElementById('d' + id);
                if (stray) stray.remove();
            }
        }
        const scheduleRender = debounce(render, 250);

        editor.addEventListener('input', () => { lsSet(LS_CODE, editor.value); scheduleRender(); });
        editor.addEventListener('keydown', e => {
            if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                if (!(document.execCommand && document.execCommand('insertText', false, '  '))) {
                    editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end');
                }
                lsSet(LS_CODE, editor.value); scheduleRender();
            }
        });
        $('#sampleSel').addEventListener('change', e => {
            const v = e.target.value;
            if (v && SAMPLES[v]) { editor.value = SAMPLES[v]; lsSet(LS_CODE, editor.value); render(); }
            e.target.value = '';
        });
        $('#mmTheme').addEventListener('change', () => { lsSet('webtools:mermaid:theme', $('#mmTheme').value); render(); });
        document.addEventListener('themechange', () => { if ($('#mmTheme').value === 'auto') render(); });

        /* ---------- export ---------- */
        function exportBg() {
            const v = $('#exBg').value;
            if (v === 'transparent') return null;
            if (v === 'white') return '#ffffff';
            if (v === 'dark') return '#0d1117';
            return effTheme() === 'dark' ? '#0d1117' : '#ffffff';
        }
        function prepSvg() {
            if (!lastSvg) { toast('書き出す図がありません'); return null; }
            const doc = new DOMParser().parseFromString(lastSvg, 'image/svg+xml');
            if (doc.querySelector('parsererror')) { toast('SVGの解析に失敗しました'); return null; }
            const root = doc.documentElement;
            let vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
            if (vb.length !== 4 || !vb.every(isFinite)) {
                vb = [0, 0, parseFloat(root.getAttribute('width')) || 800, parseFloat(root.getAttribute('height')) || 600];
                root.setAttribute('viewBox', vb.join(' '));
            }
            const w = vb[2], h = vb[3];
            root.setAttribute('width', w);
            root.setAttribute('height', h);
            root.removeAttribute('style');
            root.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            const bg = exportBg();
            if (bg) {
                const r = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
                r.setAttribute('x', vb[0]); r.setAttribute('y', vb[1]);
                r.setAttribute('width', w); r.setAttribute('height', h);
                r.setAttribute('fill', bg);
                root.insertBefore(r, root.firstChild);
            }
            return { text: new XMLSerializer().serializeToString(root), w, h };
        }
        $('#btnSvg').addEventListener('click', () => {
            const p = prepSvg();
            if (p) downloadBlob(new Blob([p.text], { type: 'image/svg+xml;charset=utf-8' }), 'diagram.svg');
        });
        $('#btnPng').addEventListener('click', async () => {
            const p = prepSvg();
            if (!p) return;
            try {
                const scale = Math.min(+$('#exScale').value, 8192 / Math.max(p.w, p.h));
                const url = URL.createObjectURL(new Blob([p.text], { type: 'image/svg+xml;charset=utf-8' }));
                const img = await loadImage(url);
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(p.w * scale));
                c.height = Math.max(1, Math.round(p.h * scale));
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, c.width, c.height);
                URL.revokeObjectURL(url);
                const blob = await canvasToBlob(c, 'image/png');
                if (!blob) throw new Error('toBlob failed');
                downloadBlob(blob, 'diagram.png');
            } catch (e) {
                toast('PNGの書き出しに失敗しました。SVG保存をお試しください');
            }
        });
        $('#btnCopyCode').addEventListener('click', () => copyText(editor.value));

        /* ---------- init ---------- */
        const savedTheme = lsGet('webtools:mermaid:theme', 'auto');
        if ($('#mmTheme').querySelector(`option[value="${savedTheme}"]`)) $('#mmTheme').value = savedTheme;
        editor.value = lsGet(LS_CODE, null) ?? SAMPLES.flowchart;
        if (!mmReady) {
            errBox.textContent = 'Mermaid の読み込みに失敗しました。ネットワーク接続を確認して再読み込みしてください。';
            errBox.hidden = false;
        } else {
            render();
        }
        initCommon({
            steps: () => [
                { popover: { title: 'Mermaid Editor', description: 'Mermaid記法で図を書くと、その場でプレビューされます。SVG / PNG で保存できます。' } },
                { element: '#editor', popover: { title: 'コードエディタ', description: 'ここにMermaidのコードを書きます。内容はブラウザに自動保存され、Tabキーでインデントできます。構文エラーは下に表示されます。', side: 'right', align: 'start' } },
                { element: '#sampleSel', popover: { title: 'テンプレート', description: 'フローチャート・シーケンス図・ER図・ガントなどの例を挿入できます（現在のコードは上書きされます）。', side: 'bottom', align: 'start' } },
                { element: '#mmTheme', popover: { title: '図のテーマ', description: '「自動」はライト/ダーク設定に追従します。default・neutral・forest などにも変更できます。', side: 'bottom', align: 'start' } },
                { element: '#stagePane', popover: { title: 'プレビュー', description: 'コードを書くと自動で再描画されます。Ctrl/⌘ を押しながらホイールでも拡大縮小できます。', side: 'left', align: 'start' } },
                { element: '#zoomGroup', popover: { title: 'ズーム', description: '拡大・縮小・100%・フィットを切り替えます。', side: 'bottom', align: 'start' } },
                { element: '#exportGroup', popover: { title: '書き出し', description: '背景（自動・透明・白・ダーク）とPNGの倍率を選んで、SVG または PNG で保存します。', side: 'bottom', align: 'end' } },
                { element: '#btnTheme', popover: { title: 'ライト / ダーク', description: '「自動（OS設定に追従）」「ライト」「ダーク」を順に切り替えます。', side: 'bottom', align: 'end' } },
                { element: '#btnHelp', popover: { title: 'ツアーをもう一度', description: 'このボタンでいつでも再表示できます。URLに ?onBoarding=1 を付けて開いても始まります。', side: 'bottom', align: 'end' } }
            ]
        });
    </script>
</body>

</html>
