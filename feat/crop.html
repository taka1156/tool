<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <title>画像クロップ・変換ツール</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.5/dist/driver.js.iife.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.5/dist/driver.css">
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface-2: #f0efed;
      --border: #e2e0db;
      --border-strong: #c8c6c0;
      --text: #1a1a18;
      --text-muted: #6b6a66;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-bg: #eff6ff;
      --accent-text: #1e40af;
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181a;
        --surface: #242426;
        --surface-2: #2e2e30;
        --border: #3a3a3c;
        --border-strong: #4e4e50;
        --text: #f0efed;
        --text-muted: #9a9997;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-bg: #1e2a3d;
        --accent-text: #93c5fd;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    header svg {
      width: 28px;
      height: 28px;
      color: var(--accent);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border-strong);
      border-radius: 16px;
      padding: 56px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--surface);
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .drop-zone svg {
      width: 40px;
      height: 40px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .drop-zone strong {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .drop-zone p {
      color: var(--text-muted);
      font-size: 13px;
    }

    .drop-zone .browse-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }

    .drop-zone .browse-btn:hover {
      background: var(--accent-hover);
    }

    /* Editor layout */
    .editor {
      display: none;
      gap: 20px;
    }

    .editor.visible {
      display: grid;
      grid-template-columns: 1fr 280px;
    }

    @media (max-width: 640px) {
      .editor.visible {
        grid-template-columns: 1fr;
      }
    }

    /* Left: crop area */
    .crop-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .crop-panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .crop-panel-header span {
      font-size: 13px;
      font-weight: 500;
    }

    .rotate-btns {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s;
      padding: 0;
    }

    .icon-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
    }

    .crop-area {
      max-height: 440px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crop-area img {
      display: block;
      max-width: 100%;
      max-height: 440px;
    }

    /* Right: settings */
    .settings-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Ratio buttons */
    .ratio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .ratio-btn {
      padding: 6px 4px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      color: var(--text-muted);
      transition: all 0.1s;
    }

    .ratio-btn:hover {
      border-color: var(--accent);
      color: var(--accent-text);
      background: var(--accent-bg);
    }

    .ratio-btn.active {
      border-color: var(--accent);
      color: var(--accent-text);
      background: var(--accent-bg);
      font-weight: 600;
    }

    /* Form fields */
    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .field-row:last-child {
      margin-bottom: 0;
    }

    .field-row label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 36px;
    }

    .field-row input[type="number"],
    .field-row select {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.1s;
    }

    .field-row input:focus,
    .field-row select:focus {
      border-color: var(--accent);
    }

    .size-sep {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Sliders */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .slider-num {
      font-size: 13px;
      font-weight: 600;
      min-width: 36px;
      text-align: right;
      color: var(--accent-text);
    }

    /* BG removal toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .toggle-label {
      font-size: 13px;
      flex: 1;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border-strong);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked+.toggle-track {
      background: var(--accent);
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked+.toggle-track::after {
      transform: translateX(16px);
    }

    /* Color picker row */
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .color-row label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 56px;
    }

    .color-row input[type="color"] {
      width: 32px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2px;
      cursor: pointer;
      background: var(--surface-2);
    }

    .color-row .color-hex {
      flex: 1;
      font-size: 12px;
      font-family: monospace;
      color: var(--text-muted);
    }

    .color-eyedrop-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* bg-settings panel */
    .bg-settings {
      margin-top: 8px;
    }

    .bg-settings.hidden {
      display: none;
    }

    /* Action buttons */
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Preview */
    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .preview-card-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-card-header .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--accent-bg);
      color: var(--accent-text);
      text-transform: none;
      letter-spacing: 0;
    }

    /* チェッカーボード（透過確認用） */
    .preview-img-wrap {
      padding: 12px;
      background-image: linear-gradient(45deg, #aaa 25%, transparent 25%),
        linear-gradient(-45deg, #aaa 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #aaa 75%),
        linear-gradient(-45deg, transparent 75%, #aaa 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #ddd;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-img-wrap img {
      max-width: 100%;
      max-height: 200px;
      display: block;
    }

    .preview-meta {
      padding: 10px 14px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.8;
      border-top: 1px solid var(--border);
    }

    .reset-link {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .reset-link:hover {
      color: var(--accent-text);
    }

    /* Spinner */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M3 9h18M9 21V9" />
      </svg>
      <h1>画像クロップ・変換</h1>
      <p>PNG / JPEG / WebP 対応</p>
    </header>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <strong>画像をドロップ</strong>
      <p>または</p>
      <button class="browse-btn" id="browseBtn">ファイルを選択</button>
      <p style="margin-top:12px">PNG・JPEG・WebP・GIF 対応</p>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <!-- Editor -->
    <div class="editor" id="editor">

      <!-- Left: Cropper -->
      <div class="crop-panel" id="cropPanel">
        <div class="crop-panel-header">
          <span>クロップ</span>
          <div class="rotate-btns" id="rotateBtns">
            <button class="icon-btn" onclick="doRotate(-90)" title="左回転">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 102.13-9.36L1 10" />
              </svg>
            </button>
            <button class="icon-btn" onclick="doRotate(90)" title="右回転">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10" />
              </svg>
            </button>
            <button class="icon-btn" onclick="doFlipH()" title="水平反転">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 00-2 2v14a2 2 0 002 2h3" />
                <path d="M16 3h3a2 2 0 012 2v14a2 2 0 01-2 2h-3" />
                <line x1="12" y1="20" x2="12" y2="4" />
              </svg>
            </button>
            <button class="icon-btn" onclick="doFlipV()" title="垂直反転">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M21 8V5a2 2 0 00-2-2H5a2 2 0 00-2 2v3" />
                <path d="M21 16v3a2 2 0 01-2 2H5a2 2 0 01-2-2v-3" />
                <line x1="4" y1="12" x2="20" y2="12" />
              </svg>
            </button>
          </div>
        </div>
        <div class="crop-area">
          <img id="cropImg" alt="編集する画像">
        </div>
      </div>

      <!-- Right: Settings -->
      <div class="settings-panel">

        <!-- Aspect ratio -->
        <div class="card">
          <div class="card-title">縦横比</div>
          <div class="ratio-grid" id="ratioGrid">
            <button class="ratio-btn active" data-ratio="free">自由</button>
            <button class="ratio-btn" data-ratio="1">1:1</button>
            <button class="ratio-btn" data-ratio="4/3">4:3</button>
            <button class="ratio-btn" data-ratio="3/4">3:4</button>
            <button class="ratio-btn" data-ratio="16/9">16:9</button>
            <button class="ratio-btn" data-ratio="9/16">9:16</button>
          </div>
        </div>

        <!-- Output size -->
        <div class="card" id="outputSizeCard">
          <div class="card-title">出力サイズ（省略で元サイズ）</div>
          <div class="field-row">
            <label>幅</label>
            <input type="number" id="outW" placeholder="例：1280" min="1" max="8000">
            <span class="size-sep">px</span>
          </div>
          <div class="field-row">
            <label>高さ</label>
            <input type="number" id="outH" placeholder="例：720" min="1" max="8000">
            <span class="size-sep">px</span>
          </div>
        </div>

        <!-- Format & quality -->
        <div class="card" id="formatCard">
          <div class="card-title">フォーマット</div>
          <div class="field-row">
            <label>形式</label>
            <select id="outFmt">
              <option value="image/jpeg">JPEG</option>
              <option value="image/png">PNG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
          <div class="card-title" style="margin-top:10px">品質（JPEG / WebP）</div>
          <div class="slider-row">
            <input type="range" id="quality" min="10" max="100" value="85" step="5">
            <span class="slider-num" id="qualityVal">85%</span>
          </div>
        </div>

        <!-- Background removal -->
        <div class="card">
          <div class="toggle-row" id="bgToggleRow">
            <span class="toggle-label">背景透過</span>
            <label class="toggle">
              <input type="checkbox" id="bgToggle">
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="bg-settings hidden" id="bgSettings">
            <div class="color-row">
              <label>背景色</label>
              <input type="color" id="bgColor" value="#ffffff">
              <span class="color-hex" id="bgColorHex">#ffffff</span>
            </div>
            <p class="color-eyedrop-hint">💡 背景色を手動で指定するか、変換後に再調整してください</p>
            <div class="card-title" style="margin-top:10px">許容範囲（tolerance）</div>
            <div class="slider-row">
              <input type="range" id="tolerance" min="0" max="120" value="30" step="1">
              <span class="slider-num" id="toleranceVal">30</span>
            </div>
            <div class="card-title" style="margin-top:10px">境界ぼかし（feather）</div>
            <div class="slider-row">
              <input type="range" id="feather" min="0" max="10" value="1" step="1">
              <span class="slider-num" id="featherVal">1</span>
            </div>
          </div>
        </div>

        <!-- Apply -->
        <button class="btn-primary" id="applyBtn" onclick="applyCrop()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          クロップして変換
        </button>

        <!-- Preview -->
        <div class="preview-card" id="previewCard" style="display:none">
          <div class="preview-card-header">
            プレビュー
            <span class="badge" id="previewBadge">—</span>
          </div>
          <div class="preview-img-wrap">
            <img id="previewImg" alt="変換結果">
          </div>
          <div class="preview-meta" id="previewMeta"></div>
        </div>

        <!-- Download -->
        <button class="btn-primary" id="dlBtn" style="display:none" onclick="downloadResult()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          ダウンロード
        </button>

        <p class="reset-link" onclick="resetTool()">← 別の画像を選ぶ</p>
      </div>
    </div>
  </div>

  <script>
    let cropper = null;
    let resultDataURL = null;
    let resultExt = 'png';
    let flipScaleX = 1, flipScaleY = 1;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const editor = document.getElementById('editor');
    const cropImg = document.getElementById('cropImg');
    const onboardingParam = new URLSearchParams(window.location.search).get('onBoarding');
    const onboardingValue = (onboardingParam || '').toLowerCase();
    const forceOnboarding = ['1', 'true'].includes(onboardingValue);
    const disableOnboarding = ['0', 'false'].includes(onboardingValue);
    let onboardingPending = !disableOnboarding && (forceOnboarding || !document.cookie.split(';').some(cookie => cookie.trim() === 'onBoarding=1'));
    let onboardingDriver = null;

    function rememberOnboarding() {
      document.cookie = 'onBoarding=1; Max-Age=31536000; Path=/; SameSite=Lax';
    }

    function createOnboardingDriver(steps, onDestroyed) {
      const createDriver = window.driver?.js?.driver;
      if (typeof createDriver !== 'function') return null;
      let driver;
      const finish = () => onDestroyed?.();
      driver = createDriver({
        showProgress: true,
        progressText: '{{current}} / {{total}}',
        nextBtnText: '次へ',
        prevBtnText: '戻る',
        doneBtnText: '完了',
        overlayOpacity: 0.55,
        steps,
        onCloseClick: () => {
          finish();
          driver.destroy();
        },
        onDoneClick: () => {
          finish();
          driver.destroy();
        },
        onDestroyed: finish,
      });
      return driver;
    }

    function startUploadOnboarding() {
      const driver = createOnboardingDriver([
        {
          element: '#dropZone',
          popover: {
            title: '画像を読み込む',
            description: 'ここに画像をドロップするか、ファイル選択から画像を読み込めます。',
            side: 'bottom',
          },
        },
        {
          element: '#browseBtn',
          popover: {
            title: 'ファイルを選択',
            description: '画像を選ぶと、クロップと変換の設定画面に進みます。',
            side: 'bottom',
          },
        },
      ], () => {
        rememberOnboarding();
        if (onboardingDriver === driver) onboardingDriver = null;
      });
      onboardingDriver = driver;
      driver?.drive();
    }

    function startEditorOnboarding() {
      if (!onboardingPending) return;
      const driver = createOnboardingDriver([
        {
          element: '#cropPanel',
          popover: {
            title: '切り抜き範囲',
            description: '画像上でドラッグして範囲を調整します。',
            side: 'right',
          },
        },
        {
          element: '#rotateBtns',
          popover: {
            title: '回転・反転',
            description: '画像を90度回転したり、水平・垂直に反転できます。',
            side: 'bottom',
          },
        },
        {
          element: '#ratioGrid',
          popover: {
            title: '縦横比',
            description: '用途に合わせた比率を選ぶか、「自由」のまま切り抜けます。',
            side: 'bottom',
          },
        },
        {
          element: '#outputSizeCard',
          popover: {
            title: '出力サイズ',
            description: '幅・高さを指定できます。空欄なら切り抜き範囲のサイズになります。',
            side: 'left',
          },
        },
        {
          element: '#formatCard',
          popover: {
            title: '形式と品質',
            description: 'JPEG、PNG、WebPと、JPEG・WebPの品質を設定します。',
            side: 'left',
          },
        },
        {
          element: '#bgToggleRow',
          popover: {
            title: '背景透過',
            description: '指定色に近い部分を透過できます。背景透過を使うとPNGで出力されます。',
            side: 'left',
          },
        },
        {
          element: '#applyBtn',
          popover: {
            title: '変換して保存',
            description: '設定した内容で変換します。結果を確認してから画像をダウンロードできます。',
            side: 'top',
          },
        },
      ], () => {
        rememberOnboarding();
        onboardingPending = false;
        if (onboardingDriver === driver) onboardingDriver = null;
      });
      onboardingDriver = driver;
      driver?.drive();
    }

    // ── Drop zone ──────────────────────────────────────────
    document.getElementById('browseBtn').addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('click', e => { if (e.target.id !== 'browseBtn') fileInput.click(); });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) loadFile(f);
    });
    fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

    function loadFile(file) {
      const url = URL.createObjectURL(file);
      if (cropper) { cropper.destroy(); cropper = null; }
      cropImg.src = url;
      flipScaleX = 1; flipScaleY = 1;
      dropZone.style.display = 'none';
      editor.classList.add('visible');
      document.getElementById('previewCard').style.display = 'none';
      document.getElementById('dlBtn').style.display = 'none';
      resultDataURL = null;
      cropImg.onload = () => {
        cropper = new Cropper(cropImg, {
          viewMode: 1,
          autoCropArea: 1,
          responsive: true,
          checkCrossOrigin: false,
        });
        if (onboardingDriver) onboardingDriver.destroy();
        if (onboardingPending) startEditorOnboarding();
      };
    }

    // ── Ratio buttons ──────────────────────────────────────
    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (!cropper) return;
        const v = btn.dataset.ratio;
        if (v === 'free') cropper.setAspectRatio(NaN);
        else { const [a, b2] = v.split('/'); cropper.setAspectRatio(b2 ? parseInt(a) / parseInt(b2) : parseFloat(a)); }
      });
    });

    // ── Sliders ────────────────────────────────────────────
    document.getElementById('quality').addEventListener('input', e => {
      document.getElementById('qualityVal').textContent = e.target.value + '%';
    });
    document.getElementById('tolerance').addEventListener('input', e => {
      document.getElementById('toleranceVal').textContent = e.target.value;
    });
    document.getElementById('feather').addEventListener('input', e => {
      document.getElementById('featherVal').textContent = e.target.value;
    });

    // ── BG toggle ──────────────────────────────────────────
    document.getElementById('bgToggle').addEventListener('change', e => {
      document.getElementById('bgSettings').classList.toggle('hidden', !e.target.checked);
      // 透過するならPNGに自動切替
      if (e.target.checked) {
        const fmt = document.getElementById('outFmt');
        if (fmt.value === 'image/jpeg') fmt.value = 'image/png';
      }
    });

    // Color picker sync
    document.getElementById('bgColor').addEventListener('input', e => {
      document.getElementById('bgColorHex').textContent = e.target.value;
    });

    // ── Rotate / flip ──────────────────────────────────────
    function doRotate(deg) { if (cropper) cropper.rotate(deg); }
    function doFlipH() { if (!cropper) return; flipScaleX *= -1; cropper.scaleX(flipScaleX); }
    function doFlipV() { if (!cropper) return; flipScaleY *= -1; cropper.scaleY(flipScaleY); }

    // ── Background removal ────────────────────────────────
    /**
     * 指定色に近いピクセルのアルファ値を 0 にする。
     * feather > 0 のときは境界付近のピクセルを半透明にしてなめらかにする。
     *
     * @param {ImageData} imageData - Canvas の getImageData 結果
     * @param {number} tr - 背景色 R
     * @param {number} tg - 背景色 G
     * @param {number} tb - 背景色 B
     * @param {number} tolerance - 色差の許容値 (0〜255)
     * @param {number} feather   - ぼかし幅 (0〜10)
     */
    function removeBackground(imageData, tr, tg, tb, tolerance, feather) {
      const d = imageData.data;
      const w = imageData.width;
      const h = imageData.height;

      // 1パス目: tolerance に基づいてマスクを作成
      // mask[i] = 0: 背景, 255: 前景
      const mask = new Uint8Array(w * h);

      for (let i = 0; i < w * h; i++) {
        const r = d[i * 4];
        const g = d[i * 4 + 1];
        const b = d[i * 4 + 2];
        const diff = Math.sqrt(
          (r - tr) ** 2 +
          (g - tg) ** 2 +
          (b - tb) ** 2
        );
        mask[i] = diff <= tolerance ? 0 : 255;
      }

      if (feather > 0) {
        // 2パス目: 前景と背景の境界付近のマスク値をなめらかに
        const softMask = new Uint8Array(mask);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = y * w + x;
            if (mask[idx] === 0) continue; // すでに背景なのでスキップ

            // feather 半径内に背景ピクセルが存在するか調べる
            let minDist = Infinity;
            for (let dy = -feather; dy <= feather; dy++) {
              for (let dx = -feather; dx <= feather; dx++) {
                const ny = y + dy, nx = x + dx;
                if (ny < 0 || ny >= h || nx < 0 || nx >= w) continue;
                if (mask[ny * w + nx] === 0) {
                  const dist = Math.sqrt(dx * dx + dy * dy);
                  if (dist < minDist) minDist = dist;
                }
              }
            }
            if (minDist <= feather) {
              // 境界からの距離に応じて 0〜255 でフェード
              softMask[idx] = Math.round((minDist / feather) * 255);
            }
          }
        }

        // softMask をアルファチャンネルに適用
        for (let i = 0; i < w * h; i++) {
          d[i * 4 + 3] = Math.min(d[i * 4 + 3], softMask[i]);
        }
      } else {
        // feather なし: そのままアルファを 0 にする
        for (let i = 0; i < w * h; i++) {
          if (mask[i] === 0) d[i * 4 + 3] = 0;
        }
      }
    }

    // ── Apply crop & convert ───────────────────────────────
    function applyCrop() {
      if (!cropper) return;

      const fmt = document.getElementById('outFmt').value;
      const quality = parseInt(document.getElementById('quality').value) / 100;
      const wVal = parseInt(document.getElementById('outW').value) || 0;
      const hVal = parseInt(document.getElementById('outH').value) || 0;
      const doBgRm = document.getElementById('bgToggle').checked;

      // 透過を使う場合はPNG強制
      const actualFmt = doBgRm ? 'image/png' : fmt;
      resultExt = actualFmt === 'image/jpeg' ? 'jpg' : actualFmt === 'image/png' ? 'png' : 'webp';

      const opts = { imageSmoothingEnabled: true, imageSmoothingQuality: 'high' };
      if (wVal > 0) opts.width = wVal;
      if (hVal > 0) opts.height = hVal;

      const canvas = cropper.getCroppedCanvas(opts);
      const ctx = canvas.getContext('2d');

      if (doBgRm) {
        const tolerance = parseInt(document.getElementById('tolerance').value);
        const feather = parseInt(document.getElementById('feather').value);

        // 背景色 (#rrggbb) を R/G/B に分解
        const hex = document.getElementById('bgColor').value;
        const tr = parseInt(hex.slice(1, 3), 16);
        const tg = parseInt(hex.slice(3, 5), 16);
        const tb = parseInt(hex.slice(5, 7), 16);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        removeBackground(imageData, tr, tg, tb, tolerance, feather);
        ctx.putImageData(imageData, 0, 0);
      }

      resultDataURL = canvas.toDataURL(actualFmt, quality);

      const preview = document.getElementById('previewImg');
      preview.src = resultDataURL;
      document.getElementById('previewBadge').textContent = resultExt.toUpperCase();
      document.getElementById('previewCard').style.display = 'block';
      document.getElementById('dlBtn').style.display = 'flex';

      const kb = Math.round(resultDataURL.length * 0.75 / 1024);
      document.getElementById('previewMeta').innerHTML =
        `サイズ　${canvas.width} × ${canvas.height} px<br>容量（目安）　約 ${kb} KB` +
        (doBgRm ? '<br>背景透過　ON' : '');

      document.getElementById('previewCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function downloadResult() {
      if (!resultDataURL) return;
      const a = document.createElement('a');
      a.href = resultDataURL;
      a.download = 'image.' + resultExt;
      a.click();
    }

    function resetTool() {
      if (cropper) { cropper.destroy(); cropper = null; }
      cropImg.src = '';
      fileInput.value = '';
      editor.classList.remove('visible');
      dropZone.style.display = 'block';
      document.getElementById('previewCard').style.display = 'none';
      document.getElementById('dlBtn').style.display = 'none';
      document.getElementById('bgToggle').checked = false;
      document.getElementById('bgSettings').classList.add('hidden');
      resultDataURL = null;
    }

    if (onboardingPending) startUploadOnboarding();
  </script>
</body>

</html>
