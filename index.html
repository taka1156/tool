<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <title>tool</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <style>
    :root {
      --bg: #15171b;
      --panel: #1a1d22;
      --panel2: #1f232a;
      --line: #262a31;
      --text: #e8eaed;
      --muted: #868c98;
      --accent: #f6821f;
      --accent-dim: rgba(246, 130, 31, .14);
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: inherit
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6
    }

    header {
      padding: 24px 20px 18px;
      border-bottom: 1px solid var(--line)
    }

    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px
    }

    li {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      overflow: hidden
    }

    a.card {
      display: block;
      padding: 16px 18px;
      color: inherit;
      text-decoration: none
    }

    a.card:hover {
      border-color: var(--accent);
      background: var(--panel2)
    }

    li:has(a.card:hover) {
      border-color: var(--accent)
    }

    .name {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .name .path {
      color: var(--muted);
      font-weight: 400;
      font-size: 11px
    }

    .desc {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px
    }

    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 6px 20px 30px;
      color: var(--muted);
      font-size: 11px
    }
  </style>
</head>

<body>
  <header>
    <h1>tool</h1>
    <p>自作ツールの一覧です</p>
  </header>
  <main>
    <ul id="tool-list"></ul>
  </main>
  <footer>tool/ 配下に各ツールのHTMLを置いて使います</footer>

  <script src="./tools.js"></script>
  <script>
    (() => {
      document.getElementById('tool-list').innerHTML = tools.map(tool => `
        <li>
          <a class="card" href="${tool.href}">
            <div class="name">${tool.name}<span class="path">${tool.path}</span></div>
            <div class="desc">${tool.description}</div>
          </a>
        </li>`).join('');
    })();
  </script>
</body>

</html>
